<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Artículo</title>
        <link href="../css/style.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Encabezado y navegación -->
        <header>
            <div class="logo"><a href="../index.html">Ferretería Los Maestros</a></div>
        </header>
        <!-- Contenido principal -->
        <main>
            <article class="formulario-container" id="blog-detalle"></article>
        </main>
        <script src="../js/blog.js"></script>
        <script>
               const id=Number(localStorage.getItem("blogSeleccionado")),b=blogs.find(x=>x.id===id),c=document.getElementById("blog-detalle");c.innerHTML=b?`<img src="${rutaImagen(b.imagen)}" alt="${b.titulo}" style="width:100%;max-height:350px;object-fit:contain">
            <h1>${b.titulo}</h1>
            <p>${b.contenido}</p>
            <br>
            <a class="btn" href="blogs.html">Volver al blog</a>`:"<p>Artículo no encontrado.</p>"
        </script>
        <script src="../js/app.js"></script>
    </body>
</html>
