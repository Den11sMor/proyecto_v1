<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Detalle del artículo
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/tienda.css">

</head>

<body>

    <header>

        <div class="logo">

            <a href="../index.html">
                Ferretería Los Maestros
            </a>

        </div>

        <nav>

            <a href="../index.html">
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="blogs.html">
                Blog
            </a>

            <a href="nosotros.html">
                Nosotros
            </a>

            <a href="contacto.html">
                Contacto
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

            <a href="carrito.html">
                Carrito
                <span id="contador-carrito">0</span>
            </a>

        </nav>

    </header>


    <main>

        <section
            id="blog-detalle"
            class="formulario-container">

        </section>

    </main>


    <footer>

        <p>
            © 2026 Ferretería Los Maestros
        </p>

    </footer>


    <!-- Primero se cargan los datos -->
    <script src="../js/datos.js"></script>

    <!-- Funciones generales -->
    <script src="../js/app.js"></script>

    <!-- Contador y funciones del carrito -->
    <script src="../js/carrito.js"></script>

    <!-- Funciones del blog -->
    <script src="../js/blog.js"></script>


    <script>

        const id =
            Number(
                localStorage.getItem(
                    "blogSeleccionado"
                )
            );


        const blog =
            blogs.find(
                articulo =>
                    articulo.id === id
            );


        const contenedor =
            document.getElementById(
                "blog-detalle"
            );


        if (!blog) {

            contenedor.innerHTML = `

                <h1>
                    Artículo no encontrado
                </h1>

                <p>
                    El artículo que buscas
                    no existe o ya no está disponible.
                </p>

                <br>

                <a
                    href="blogs.html"
                    class="btn">
                    Volver al blog
                </a>

            `;

        } else {

            contenedor.innerHTML = `

                <article>

                    <img
                        src="${rutaImagen(blog.imagen)}"
                        alt="${blog.titulo}"
                        style="
                            width: 100%;
                            max-width: 800px;
                            max-height: 400px;
                            object-fit: contain;
                            display: block;
                            margin: 0 auto 25px;
                        "
                    >

                    <h1>
                        ${blog.titulo}
                    </h1>

                    <p>
                        ${blog.contenido}
                    </p>

                    <br>

                    <a
                        href="blogs.html"
                        class="btn">
                        Volver al blog
                    </a>

                </article>

            `;

        }

    </script>

</body>

</html>
