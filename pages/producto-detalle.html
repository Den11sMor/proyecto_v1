<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Detalle del producto
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/tienda.css">

</head>

<body>

    <header>

        <div class="logo">

            <a href="../index.html">
                Ferretería Los Maestros
            </a>

        </div>

        <nav>

            <a href="../index.html">
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="blogs.html">
                Blog
            </a>

            <a href="nosotros.html">
                Nosotros
            </a>

            <a href="contacto.html">
                Contacto
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

            <a href="carrito.html">
                Carrito
                <span id="contador-carrito">0</span>
            </a>

        </nav>

    </header>

    <main>

        <section
            id="detalle-producto"
            class="detalle-producto">
        </section>

    </main>

    <script src="../js/datos.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/carrito.js"></script>

    <script>

        const codigo =
            localStorage.getItem(
                "productoSeleccionado"
            );

        const producto =
            obtenerProductos().find(
                p => p.codigo === codigo
            );

        const contenedor =
            document.getElementById(
                "detalle-producto"
            );

        if (!producto) {

            contenedor.innerHTML = `
                <p>
                    Producto no encontrado.
                </p>

                <br>

                <a
                    class="btn"
                    href="productos.html">
                    Volver a productos
                </a>
            `;

        } else {

            contenedor.innerHTML = `

                <img
                    src="${rutaImagen(producto.imagen)}"
                    alt="${producto.nombre}"
                >

                <div>

                    <h1>
                        ${producto.nombre}
                    </h1>

                    <p>
                        ${producto.descripcion}
                    </p>

                    <p>
                        <strong>
                            Categoría:
                        </strong>

                        ${producto.categoria}
                    </p>

                    <h2>
                        $${producto.precio.toLocaleString("es-CL")}
                    </h2>

                    <p>
                        Stock:
                        ${producto.stock}
                    </p>

                    ${
                        producto.stock <=
                        producto.stockCritico
                            ? `
                                <p class="stock-alerta">
                                    Stock crítico
                                </p>
                            `
                            : ""
                    }

                    <label for="cantidad">
                        Cantidad
                    </label>

                    <input
                        id="cantidad"
                        type="number"
                        min="1"
                        max="${producto.stock}"
                        value="1"
                    >

                    <br>
                    <br>

                    <button
                        type="button"
                        onclick="
                            agregarAlCarrito(
                                '${producto.codigo}',
                                document.getElementById(
                                    'cantidad'
                                ).value
                            )
                        ">
                        Añadir al carrito
                    </button>

                    <a
                        class="btn"
                        href="productos.html">
                        Volver a productos
                    </a>

                </div>

            `;
        }

    </script>

</body>

</html>
