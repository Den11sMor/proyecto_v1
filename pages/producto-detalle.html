<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Detalle del producto</title>
        <link href="../css/style.css" rel="stylesheet" />
        <link href="../css/tienda.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Encabezado y navegación -->
        <header>
            <div class="logo"><a href="../index.html">Ferretería Los Maestros</a></div>
            <nav>
            <a href="../index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="carrito.html">Carrito</a>
        </nav>
        </header>
        <!-- Contenido principal -->
        <main>
            <section class="detalle-producto" id="detalle-producto"></section>
        </main>
        <script src="../js/datos.js"></script>
        <script src="../js/carrito.js"></script>
        <script src="../js/app.js"></script>
        <script>
            const codigo = localStorage.getItem("productoSeleccionado");
            const producto = obtenerProductos().find(p => p.codigo === codigo);
            const contenedor = document.getElementById("detalle-producto");

            if (!producto) {
                contenedor.innerHTML = "<p>Producto no encontrado.</p>";
            } else {
                contenedor.innerHTML = `
                    <img src="${rutaImagen(producto.imagen)}" alt="${producto.nombre}">
                    <div>
                        <h1>${producto.nombre}</h1>
                        <p>${producto.descripcion}</p>
                        <p><strong>Categoría:</strong> ${producto.categoria}</p>
                        <h2>$${producto.precio.toLocaleString("es-CL")}</h2>
                        <p>Stock: ${producto.stock}</p>
                        ${producto.stock <= producto.stockCritico
                            ? '<p class="stock-alerta">Stock crítico</p>'
                            : ""}
                        <label>
                            Cantidad
                            <input id="cantidad" type="number" min="1" max="${producto.stock}" value="1">
                        </label>
                        <br>
                        <br>
                        <button onclick="agregarAlCarrito('${producto.codigo}', document.getElementById('cantidad').value)">
                            Añadir al carrito
                        </button>
                    </div>
                `;
            }
        </script>
    </body>
</html>
