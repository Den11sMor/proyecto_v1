<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Contacto</title>
        <link href="../css/style.css" rel="stylesheet" />
        <link href="../css/formularios.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Encabezado y navegación -->
        <header>
            <div class="logo"><a href="../index.html">Ferretería Los Maestros</a></div>
        </header>
        <!-- Contenido principal -->
        <main>
            <section class="formulario-container">
                <h1>Contáctanos</h1>
                <form id="form-contacto">
                    <label>Nombre</label>
                    <input id="contacto-nombre" maxlength="100" required="" />
                    <label>Correo</label>
                    <input id="contacto-correo" maxlength="100" type="email" />
                    <label>Mensaje</label>
                    <textarea id="contacto-mensaje" maxlength="500" required=""></textarea>
                    <button type="submit">Enviar mensaje</button>
                </form>
            </section>
        </main>
        <script src="../js/validaciones.js"></script>
        <script src="../js/contacto.js"></script>
    </body>
</html>
