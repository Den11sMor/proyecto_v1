<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Formulario de Producto
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/formularios.css">

</head>

<body>

    <header>

        <div class="logo">

            <a href="index.html">
                Administración
            </a>

        </div>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="usuarios.html">
                Usuarios
            </a>

            <a href="../index.html">
                Tienda
            </a>

        </nav>

    </header>


    <main class="form-container">

        <h1>
            Formulario de producto
        </h1>

        <form id="form-producto">

            <label for="codigo">
                Código
            </label>

            <input
                type="text"
                id="codigo"
                required>


            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                required>


            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                required></textarea>


            <label for="precio">
                Precio
            </label>

            <input
                type="number"
                id="precio"
                min="0"
                required>


            <label for="stock">
                Stock
            </label>

            <input
                type="number"
                id="stock"
                min="0"
                required>


            <label for="stockCritico">
                Stock crítico
            </label>

            <input
                type="number"
                id="stockCritico"
                min="0"
                required>


            <label for="categoria">
                Categoría
            </label>

            <input
                type="text"
                id="categoria"
                required>


            <label for="imagen">
                Imagen
            </label>

            <select
                id="imagen"
                required>

                <option value="">
                    Seleccionar imagen
                </option>

                <option
                    value="img/productos/martillo_img.jpg">
                    Martillo
                </option>

                <option
                    value="img/productos/destornillador_img.jpg">
                    Destornillador
                </option>

                <option
                    value="img/productos/taladro_img.jpg">
                    Taladro
                </option>

                <option
                    value="img/productos/tornillos_img.jpg">
                    Tornillos
                </option>

                <option
                    value="img/productos/cinta_img.jpg">
                    Cinta métrica
                </option>

            </select>


            <button
                type="submit">
                Guardar producto
            </button>

        </form>

    </main>


    <script src="../js/datos.js"></script>
    <script src="../js/admin-productos.js"></script>

</body>

</html>
